name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show toolchain
        run: swiftc --version

      - name: Build universal app
        run: ./scripts/build.sh

      - name: Package zip and dmg
        run: ./scripts/package.sh

      - name: Verify architectures
        run: lipo -archs BatteryLens.app/Contents/MacOS/BatteryLens

      - name: Verify CLI
        run: ./BatteryLens.app/Contents/MacOS/BatteryLens --print || true

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: BatteryLens
          path: dist/*

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.zip
            dist/*.dmg
          generate_release_notes: true
